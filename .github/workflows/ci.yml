name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # The M0 gate. Claritty Studio's whole design rests on one claim — that an
  # unmodified automation runs against a local control plane — so it is checked
  # on every commit rather than assumed. If this job goes red, the architecture
  # broke, not the test.
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the published SDK (not a checkout — the point is that it is unmodified)
        run: |
          python -m venv .venv-probe
          ./.venv-probe/bin/pip install --quiet "claritty-sdk>=2.11,<3" fastapi "uvicorn[standard]"
      - run: pnpm spike
      # The M3 proof: an automation reaching a real HTTP service through the
      # vault and the connector engine, with the credential never leaving the host.
      - run: pnpm proof:integrations

  # The design system is generated from clarity-platform. If someone edits the
  # generated files by hand, or upstream moves a load-bearing value, this fails
  # rather than letting Studio and the platform drift apart in silence.
  design-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Clarittyai/clarity-platform
          path: vendor/clarity-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check the generated design files are current
        # Skipped when the private platform checkout is unavailable — an
        # outside contributor should not see a red X they cannot fix.
        run: |
          if [ -f vendor/clarity-platform/tailwind.config.ts ]; then
            pnpm --filter @claritty-studio/design sync:check
          else
            echo "No platform checkout available — skipping drift check."
          fi

  # "No accounts, no telemetry, no phoning home" is a promise, so it is a test.
  no-phone-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert nothing calls Claritty or an auth provider at runtime
        run: |
          set -euo pipefail
          hits=$(grep -rInE 'https?://[a-z0-9.-]*(claritty\.ai|auth0\.com)' \
                   --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
                   --include='*.py' \
                   apps packages scripts 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "Runtime code must not reach claritty.ai or auth0.com."
            echo "Links belong in markdown and the About box only."
            echo "$hits"
            exit 1
          fi
          echo "OK — no runtime call sites."
