name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's `packageManager` field is
      # the single pin, and action-setup errors out if both are given.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # The M0 gate. Clarity Studio's whole design rests on one claim — that an
  # unmodified automation runs against a local control plane — so it is checked
  # on every commit rather than assumed. If this job goes red, the architecture
  # broke, not the test.
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the published SDK (not a checkout — the point is that it is unmodified)
        run: |
          python -m venv .venv-probe
          ./.venv-probe/bin/pip install --quiet "claritty-sdk>=2.11,<3" fastapi "uvicorn[standard]"
      - run: pnpm spike
      # The M3 proof: an automation reaching a real HTTP service through the
      # vault and the connector engine, with the credential never leaving the host.
      - run: pnpm proof:integrations
      # "Bring your own model" is a promise too: a configured endpoint must
      # actually receive the run's model call.
      - run: pnpm proof:byom
      # And "it runs on its schedule" is the biggest promise of the three. This
      # caught the app never constructing a Dispatcher at all, so the triggers it
      # listed — with a next-run time — fired nothing.
      - run: pnpm proof:schedule
      # "New automation" is the first thing anyone does, and most of it happens
      # where a unit test cannot see: a dialog, a recursive copy, an adopt, and a
      # coding agent handed the request. Any step can half-succeed and leave a
      # folder that looks created and cannot run.
      - run: pnpm proof:generation
      # Every automation runs on `claritty-sdk` from public PyPI and nothing
      # else ships it. This installs the seed's own requirements into a clean
      # venv and strict-validates the shipped manifest with what came back —
      # so an unpublished version, a private index, or an SDK release that
      # tightens the schema fails here rather than on someone's machine.
      - run: pnpm proof:sdk
      # The promise on the Home screen — "it runs on its schedule" — is the one
      # nothing covered end to end. proof:schedule drives the dispatcher against
      # a stub listener; proof:run presses the button. Neither proves a schedule
      # runs a real automation, which is the whole product.
      - run: pnpm proof:scheduled-run
      # The seed's catalog describes the hosted platform; Studio brokers a
      # subset. An agent reading a manifest cannot tell the difference unless
      # the annotations are current, and a stale annotation is worse than none —
      # it reads as a checked fact. Regenerate and require no diff.
      - name: Assert the catalog's local-availability marks are current
        run: |
          pnpm sync:catalog
          if ! git diff --quiet -- packages/automation-seed/catalog docs/connectors.md docs/llms.txt; then
            echo "catalog annotations are stale — run 'pnpm sync:catalog' and commit"
            git diff --stat -- packages/automation-seed/catalog docs/connectors.md docs/llms.txt
            exit 1
          fi

  # The design system is generated from clarity-platform. If someone edits the
  # generated files by hand, or upstream moves a load-bearing value, this fails
  # rather than letting Studio and the platform drift apart in silence.
  design-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Clarittyai/clarity-platform
          path: vendor/clarity-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check the generated design files are current
        # Skipped when the private platform checkout is unavailable — an
        # outside contributor should not see a red X they cannot fix.
        run: |
          if [ -f vendor/clarity-platform/tailwind.config.ts ]; then
            pnpm --filter @clarity-studio/design sync:check
          else
            echo "No platform checkout available — skipping drift check."
          fi

  # "No accounts, no telemetry, no phoning home" is a promise, so it is a test.
  no-phone-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert nothing calls Clarity or an auth provider at runtime
        run: |
          set -euo pipefail
          # The promise is "no accounts, no telemetry, no phoning home". That is
          # about what the app does ON ITS OWN — not a rule that it may never
          # name where it came from. So this distinguishes two things:
          #
          #   a URL the RUNTIME calls → forbidden, anywhere
          #   a URL a PERSON clicks   → allowed, but only in cloud-links.ts,
          #                             which is constants and never fetches
          #
          # Both spellings: the repo is one-`t`, the live domain is still two.
          LINKS='apps/desktop/src/renderer/components/cloud-links.ts'
          # Built output inlines those constants, so a checkout that happens to
          # have a dist/ would fail for no reason. This job does not build, but
          # a local run does, and a gate that only passes by luck is not a gate.
          hits=$(grep -rInE 'https?://[a-z0-9.-]*(clarit{1,2}y\.ai|auth0\.com)' \
                   --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
                   --include='*.py' \
                   --exclude-dir=dist --exclude-dir=release --exclude-dir=node_modules \
                   apps packages scripts 2>/dev/null \
                 | grep -v "^$LINKS:" || true)
          if [ -n "$hits" ]; then
            echo "Runtime code must not reach the Clarity site or auth0.com."
            echo "A link a person clicks belongs in $LINKS; anything else is a call."
            echo "$hits"
            exit 1
          fi
          # And that file must stay constants. The moment it fetches, the app IS
          # phoning home and the exception above stops being true.
          if grep -nE 'fetch\(|XMLHttpRequest|axios|WebSocket' "$LINKS" 2>/dev/null; then
            echo "$LINKS is exempt only because it never calls out. It just did."
            exit 1
          fi
          echo "OK — no runtime call sites."

  # The rename to one `t` is easy to undo by accident — an agent "fixing" a typo,
  # a copy-paste from the platform repo. This pins which spelling is allowed where.
  naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert two-`t` spellings only appear where upstream requires them
        run: |
          set -euo pipefail
          # Everything below is read by claritty-sdk, published under that name,
          # or is a live address. Renaming any of it breaks automations silently.
          allowed='claritty-sdk|claritty_sdk|CLARITTY_[A-Z0-9_]*|[Xx]-[Cc]laritty-|x_claritty_'
          allowed="$allowed"'|claritty_finish|claritty-seed-verify|claritty-eval'
          allowed="$allowed"'|claritty-proxy|claritty\.(step|workflow|agent|tool|run|user|idempotency)\.'
          allowed="$allowed"'|Clarittyai|claritty\.ai|create-claritty-app|\.claritty-allowlist'
          allowed="$allowed"'|_claritty_redactor|claritty_user_context'
          # The *brand* is two-`t` and always capitalised — it is what the app
          # calls itself and what the wordmark spells. Repo-owned identifiers are
          # lowercase or kebab, so allowing only the capitalised form still
          # catches `claritty-studio`, `claritty_foo` and friends.
          allowed="$allowed"'|Claritty'
          # This file is skipped because the check's own pattern would match it.
          stray=$(grep -rIn -i 'claritty' \
                    --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
                    --exclude-dir=.turbo --exclude-dir=.venv-probe \
                    . 2>/dev/null \
                    | grep -v '^\./\.github/workflows/ci\.yml:' \
                    | grep -vE "$allowed" || true)
          if [ -n "$stray" ]; then
            echo "Found a two-\`t\` spelling outside the upstream SDK contract."
            echo "Anything this repo owns is spelled 'clarity'. See CLAUDE.md."
            echo "$stray"
            exit 1
          fi
          echo "OK — naming is consistent."
