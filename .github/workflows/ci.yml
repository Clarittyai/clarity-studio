name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's `packageManager` field is
      # the single pin, and action-setup errors out if both are given.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # The M0 gate. Clarity Studio's whole design rests on one claim — that an
  # unmodified automation runs against a local control plane — so it is checked
  # on every commit rather than assumed. If this job goes red, the architecture
  # broke, not the test.
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the published SDK (not a checkout — the point is that it is unmodified)
        run: |
          python -m venv .venv-probe
          ./.venv-probe/bin/pip install --quiet "claritty-sdk>=2.11,<3" fastapi "uvicorn[standard]"
      - run: pnpm spike
      # The M3 proof: an automation reaching a real HTTP service through the
      # vault and the connector engine, with the credential never leaving the host.
      - run: pnpm proof:integrations
      # "Bring your own model" is a promise too: a configured endpoint must
      # actually receive the run's model call.
      - run: pnpm proof:byom

  # The design system is generated from clarity-platform. If someone edits the
  # generated files by hand, or upstream moves a load-bearing value, this fails
  # rather than letting Studio and the platform drift apart in silence.
  design-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Clarittyai/clarity-platform
          path: vendor/clarity-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check the generated design files are current
        # Skipped when the private platform checkout is unavailable — an
        # outside contributor should not see a red X they cannot fix.
        run: |
          if [ -f vendor/clarity-platform/tailwind.config.ts ]; then
            pnpm --filter @clarity-studio/design sync:check
          else
            echo "No platform checkout available — skipping drift check."
          fi

  # "No accounts, no telemetry, no phoning home" is a promise, so it is a test.
  no-phone-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert nothing calls Clarity or an auth provider at runtime
        run: |
          set -euo pipefail
          # Both spellings: the repo is one-`t`, the live domain is still two.
          hits=$(grep -rInE 'https?://[a-z0-9.-]*(clarit{1,2}y\.ai|auth0\.com)' \
                   --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
                   --include='*.py' \
                   apps packages scripts 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "Runtime code must not reach the Clarity site or auth0.com."
            echo "Links belong in markdown and the About box only."
            echo "$hits"
            exit 1
          fi
          echo "OK — no runtime call sites."

  # The rename to one `t` is easy to undo by accident — an agent "fixing" a typo,
  # a copy-paste from the platform repo. This pins which spelling is allowed where.
  naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert two-`t` spellings only appear where upstream requires them
        run: |
          set -euo pipefail
          # Everything below is read by claritty-sdk, published under that name,
          # or is a live address. Renaming any of it breaks automations silently.
          allowed='claritty-sdk|claritty_sdk|CLARITTY_[A-Z0-9_]*|[Xx]-[Cc]laritty-|x_claritty_'
          allowed="$allowed"'|claritty_finish|claritty-seed-verify|claritty-eval'
          allowed="$allowed"'|claritty-proxy|claritty\.(step|workflow|agent|tool|run|user|idempotency)\.'
          allowed="$allowed"'|Clarittyai|claritty\.ai|create-claritty-app|\.claritty-allowlist'
          allowed="$allowed"'|_claritty_redactor|claritty_user_context'
          # The *brand* is two-`t` and always capitalised — it is what the app
          # calls itself and what the wordmark spells. Repo-owned identifiers are
          # lowercase or kebab, so allowing only the capitalised form still
          # catches `claritty-studio`, `claritty_foo` and friends.
          allowed="$allowed"'|Claritty'
          # This file is skipped because the check's own pattern would match it.
          stray=$(grep -rIn -i 'claritty' \
                    --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
                    --exclude-dir=.turbo --exclude-dir=.venv-probe \
                    . 2>/dev/null \
                    | grep -v '^\./\.github/workflows/ci\.yml:' \
                    | grep -vE "$allowed" || true)
          if [ -n "$stray" ]; then
            echo "Found a two-\`t\` spelling outside the upstream SDK contract."
            echo "Anything this repo owns is spelled 'clarity'. See CLAUDE.md."
            echo "$stray"
            exit 1
          fi
          echo "OK — naming is consistent."
