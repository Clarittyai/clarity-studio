packages:
  - 'apps/*'
  - 'packages/*'

# The automation seed is a Python project vendored as a template, not a JS package.
# Electron ships a prebuilt binary via a postinstall script. pnpm 10 blocks
# those by default, which leaves node_modules/electron without an executable
# and produces a confusing "failed to install correctly" at launch.
onlyBuiltDependencies:
  - electron
  - esbuild
  # The terminal panel needs a real pty — Claude Code is a TUI and cannot be
  # driven through plain pipes. This is the repo's only native dependency; it
  # compiles on install and is then rebuilt against Electron's ABI.
  - node-pty
